schema_version: 1
subject: appearance
value:
  background:
    - {id: bg-hsv, type: HueSaturationValue, probability: 0.8, params: {hue_shift_limit: [-40, 40], sat_shift_limit: [-50, 50], val_shift_limit: [-50, 50]}}
    - {id: bg-brightness-contrast, type: RandomBrightnessContrast, probability: 0.7, params: {brightness_limit: [-0.32, 0.32], contrast_limit: [-0.32, 0.32], brightness_by_max: true, ensure_safe_range: true}}
  foreground:
    - {id: fg-hsv, type: HueSaturationValue, probability: 0.7, params: {hue_shift_limit: [-3, 3], sat_shift_limit: [-8, 8], val_shift_limit: [-6, 6]}}
  final:
    - {id: final-gamma, type: RandomGamma, probability: 0.5, params: {gamma_limit: [90, 110]}}
    - {id: final-motion-blur, type: MotionBlur, probability: 0.35, params: {blur_limit: [13, 17], angle_range: [0, 180], direction_range: [-1, 1]}}
