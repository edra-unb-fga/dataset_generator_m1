schema_version: 1
subject: appearance
value:
  background: []
  foreground:
    - {id: coherent-wear, type: SurfaceWear, probability: 0.65, params: {fade: 0.03, dirt: 0.06, scratches: 0.04, marks: 6}}
    - {id: coherent-foreground-grain, type: GaussNoise, probability: 0.15, params: {std_range: [0.003, 0.012], mean_range: [0.0, 0.0], per_channel: false}}
  final:
    - {id: coherent-image-grain, type: GaussNoise, probability: 0.15, params: {std_range: [0.003, 0.012], mean_range: [0.0, 0.0], per_channel: false}}
    - {id: coherent-exposure, type: RandomBrightnessContrast, probability: 0.35, params: {brightness_limit: [-0.04, 0.04], contrast_limit: [-0.06, 0.06], ensure_safe_range: true}}
    - {id: coherent-motion, type: MotionBlur, probability: 0.05, params: {blur_limit: [3, 3], allow_shifted: false}}
    - {id: coherent-compression, type: ImageCompression, probability: 0.3, params: {quality_range: [88, 98], compression_type: jpeg}}
