schema_version: 1
subject: appearance
value:
  background: []
  foreground:
  - id: coherent-wear
    type: SurfaceWear
    probability: 0.75
    params:
      fade: 0.08
      dirt: 0.18
      scratches: 0.12
      marks: 12
  - id: coherent-foreground-grain
    type: GaussNoise
    probability: 0.15
    params:
      std_range:
      - 0.003
      - 0.012
      mean_range:
      - 0.0
      - 0.0
      per_channel: false
  final:
  - id: coherent-image-grain
    type: GaussNoise
    probability: 0.15
    params:
      std_range:
      - 0.003
      - 0.012
      mean_range:
      - 0.0
      - 0.0
      per_channel: false
  - id: coherent-exposure
    type: RandomBrightnessContrast
    probability: 0.35
    params:
      brightness_limit:
      - -0.08
      - 0.08
      contrast_limit:
      - -0.1
      - 0.1
      ensure_safe_range: true
  - id: coherent-weighted-motion
    type: WeightedMotionBlur
    probability: 0.7
    params:
      kernels:
      - 3
      - 7
      - 15
      weights:
      - 4
      - 2
      - 1
  - id: coherent-compression
    type: ImageCompression
    probability: 0.3
    params:
      quality_range:
      - 88
      - 98
      compression_type: jpeg
