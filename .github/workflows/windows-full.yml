name: Windows full validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra evaluation
      - run: uv run python scripts/generate_schemas.py
      - run: git diff --exit-code -- docs/schema
      - run: uv run pytest -q
      - name: Guided configuration noninteractive smoke
        run: >-
          uv run python -m dataset_generator_m1 configure
          --family landing --output outputs/windows-composer.yaml
          --run-output-dir outputs/windows-configured-pool
          --output-format json
      - run: uv run python -m dataset_generator_m1 resolve --config outputs/windows-composer.yaml --set run.num_images=1 --output-format json
      - run: uv run python -m dataset_generator_m1 preflight --config outputs/windows-composer.yaml --output-dir outputs/windows-configured-pool --output-format json
      - name: Quick augmentation correctness study
        run: >-
          uv run python -m dataset_generator_m1 experiment augmentations
          --config examples/configs/landing_minimal.yaml
          --output-dir outputs/experiments/windows-quick
          --warmups 0 --samples 1 --display quiet
      - name: Shared surface and occlusion public CLI correctness
        run: >-
          uv run python -m dataset_generator_m1 generate
          --config examples/configs/landing-pad_occlusion.yaml
          --num-images 2 --workers 2 --qa-samples 1
          --set 'output.image_size=[128,128]' --set scene.occlusion.probability=1
          --output-dir outputs/windows-surface-pool --display quiet --output-format json
      - run: uv run python scripts/smoke_analysis.py --pool outputs/windows-surface-pool --output-dir outputs/windows-surface-analysis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-augmentation-report
          path: outputs/experiments/windows-quick/
          retention-days: 7
