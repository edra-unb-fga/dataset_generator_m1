name: Full CLI validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: full-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra evaluation
      - name: Discover profiles
        run: uv run python -m dataset_generator_m1 catalog list --output-format json > outputs-catalog.json
      - name: Configure landing
        run: >-
          uv run python -m dataset_generator_m1 configure --family landing
          --output outputs/ci/landing-ci.yaml --run-output-dir outputs/ci/landing-pool
          --output-format json
      - name: Configure manometro
        run: >-
          uv run python -m dataset_generator_m1 configure --family manometro
          --output outputs/ci/manometro-ci.yaml --run-output-dir outputs/ci/manometro-pool
          --output-format json
      - name: Resolve, validate, and preflight
        shell: bash
        run: |
          uv run python -m dataset_generator_m1 resolve --config outputs/ci/landing-ci.yaml --output-format json > outputs/ci/landing-resolved.json
          uv run python -m dataset_generator_m1 validate --config outputs/ci/landing-ci.yaml --output-format json > outputs/ci/landing-validation.json
          uv run python -m dataset_generator_m1 preflight --config outputs/ci/landing-ci.yaml --output-dir outputs/ci/landing-pool --workers 2 --output-format json > outputs/ci/landing-preflight.json
          uv run python -m dataset_generator_m1 resolve --config outputs/ci/manometro-ci.yaml --output-format json > outputs/ci/manometro-resolved.json
          uv run python -m dataset_generator_m1 validate --config outputs/ci/manometro-ci.yaml --output-format json > outputs/ci/manometro-validation.json
          uv run python -m dataset_generator_m1 preflight --config outputs/ci/manometro-ci.yaml --output-dir outputs/ci/manometro-pool --workers 2 --output-format json > outputs/ci/manometro-preflight.json
      - name: Generate landing
        run: >-
          uv run python -m dataset_generator_m1 generate --config outputs/ci/landing-ci.yaml
          --num-images 10 --workers 2 --qa-samples 3 --output-dir outputs/ci/landing-pool
          --display quiet --output-format json
      - name: Generate manometro
        run: >-
          uv run python -m dataset_generator_m1 generate --config outputs/ci/manometro-ci.yaml
          --num-images 10 --workers 2 --qa-samples 3 --output-dir outputs/ci/manometro-pool
          --display quiet --output-format json
      - name: Inspect completed pools
        shell: bash
        run: |
          uv run python -m dataset_generator_m1 run status outputs/ci/landing-pool --output-format json > outputs/ci/landing-status.json
          uv run python -m dataset_generator_m1 run inspect outputs/ci/landing-pool --output-format json > outputs/ci/landing-inspection.json
          uv run python -m dataset_generator_m1 run status outputs/ci/manometro-pool --output-format json > outputs/ci/manometro-status.json
          uv run python -m dataset_generator_m1 run inspect outputs/ci/manometro-pool --output-format json > outputs/ci/manometro-inspection.json
      - name: Rectangular pad CLI journey
        shell: bash
        run: |
          uv run python -m dataset_generator_m1 configure --family landing-pad --output outputs/ci/pad.yaml --output-format json
          uv run python -m dataset_generator_m1 validate --config outputs/ci/pad.yaml --output-format json > outputs/ci/landing-pad-validation.json
          uv run python -m dataset_generator_m1 resolve --config outputs/ci/pad.yaml --output-format json > outputs/ci/landing-pad-resolved.json
          uv run python -m dataset_generator_m1 preflight --config outputs/ci/pad.yaml --output-dir outputs/ci/landing-pad-pool --workers 2 --output-format json > outputs/ci/landing-pad-preflight.json
          uv run python -m dataset_generator_m1 generate --config outputs/ci/pad.yaml --num-images 10 --workers 2 --qa-samples 3 --output-dir outputs/ci/landing-pad-pool --display quiet --output-format json
          uv run python -m dataset_generator_m1 run status outputs/ci/landing-pad-pool --output-format json > outputs/ci/landing-pad-status.json
          uv run python -m dataset_generator_m1 run inspect outputs/ci/landing-pad-pool --output-format json > outputs/ci/landing-pad-inspection.json
          uv run python -m dataset_generator_m1 export --pool outputs/ci/landing-pad-pool --task detection --output-dir outputs/ci/landing-pad-detection-export --output-format json
          uv run python -m dataset_generator_m1 export --pool outputs/ci/landing-pad-pool --task segmentation --output-dir outputs/ci/landing-pad-segmentation-export --output-format json
      - name: Export landing detection and segmentation
        shell: bash
        run: |
          uv run python -m dataset_generator_m1 export --pool outputs/ci/landing-pool --task detection --strategy random --output-dir outputs/ci/landing-detection-export --output-format json
          uv run python -m dataset_generator_m1 export --pool outputs/ci/landing-pool --task segmentation --strategy random --output-dir outputs/ci/landing-segmentation-export --output-format json
      - name: Export manometro detection and segmentation
        shell: bash
        run: |
          uv run python -m dataset_generator_m1 export --pool outputs/ci/manometro-pool --task detection --strategy random --output-dir outputs/ci/manometro-detection-export --output-format json
          uv run python -m dataset_generator_m1 export --pool outputs/ci/manometro-pool --task segmentation --strategy random --output-dir outputs/ci/manometro-segmentation-export --output-format json
      - name: Verify segmentation export evidence
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          for family in ("landing", "manometro", "landing-pad"):
              root = Path(f"outputs/ci/{family}-segmentation-export")
              report = json.loads((root / "export.json").read_text())
              assert report["task"] == "segmentation"
              assert report["fidelity"]["instances"] > 0
              assert len(list((root / "labels").rglob("*.txt"))) == 10
              assert not any(Path(item["source_pool_id"]).is_absolute() for item in report["samples"])
          PY
      - name: Offline exact-mask evaluation and reference correctness
        run: >-
          uv run python scripts/smoke_analysis.py --pool outputs/ci/landing-pad-pool
          --output-dir outputs/ci/analysis
      - name: Experimental shared surfaces and occlusion CLI journey
        shell: bash
        run: |
          uv run python -m dataset_generator_m1 generate --config examples/configs/landing-pad_occlusion.yaml --num-images 3 --workers 2 --qa-samples 2 --set 'output.image_size=[256,256]' --set scene.occlusion.probability=1 --output-dir outputs/ci/surface-pool --display quiet --output-format json
          uv run python -m dataset_generator_m1 run inspect outputs/ci/surface-pool --output-format json > outputs/ci/surface-inspection.json
          uv run python -m dataset_generator_m1 export --pool outputs/ci/surface-pool --task detection --output-dir outputs/ci/surface-detection-export --output-format json
          uv run python -m dataset_generator_m1 export --pool outputs/ci/surface-pool --task segmentation --output-dir outputs/ci/surface-segmentation-export --output-format json
          uv run python scripts/smoke_analysis.py --pool outputs/ci/surface-pool --output-dir outputs/ci/surface-analysis
      # Execution policy correctness only: this tiny screen is not a timing gate.
      - name: Portable production benchmark correctness
        run: >-
          uv run python -m dataset_generator_m1 benchmark --production
          --config examples/benchmarks/landing-screen.yaml
          --execution-matrix examples/benchmarks/execution-policies.yaml
          --samples 2 --warmup 0 --repeats 1
          --output-dir outputs/ci/execution-screen --output-format json
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-cli-evidence
          retention-days: 7
          path: |
            outputs-catalog.json
            outputs/ci/*.yaml
            outputs/ci/*.json
            outputs/ci/*-pool/run.json
            outputs/ci/*-pool/summary.json
            outputs/ci/*-pool/samples.jsonl
            outputs/ci/*-pool/rejections.jsonl
            outputs/ci/*-pool/metrics.jsonl
            outputs/ci/*-pool/control.json
            outputs/ci/*-pool/control-events.jsonl
            outputs/ci/*-pool/qa/
            outputs/ci/*-export/export.json
            outputs/ci/*-export/data.yaml
            outputs/ci/execution-screen/benchmark.json
