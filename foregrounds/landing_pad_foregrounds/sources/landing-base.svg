<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background -->
  <rect x="0" y="0" width="500" height="500" fill="#25408f" />
  <!-- Yellow square perimeter -->
  <rect x="12.5" y="12.5" width="475" height="475" fill="none" stroke="#fde900" stroke-width="25" />
  <!-- Yellow circle perimeter -->
  <circle cx="250" cy="250" r="187.5" fill="none" stroke="#fde900" stroke-width="25" />
  <!-- Center yellow cross (no rounded caps) -->
  <g stroke="#fde900" stroke-width="25">
    <line x1="125" y1="250" x2="375" y2="250" />
    <line x1="250" y1="125" x2="250" y2="375" />
  </g>
</svg>