[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-generator-m1"
version = "0.1.0"
description = "Synthetic YOLO dataset generator for manometro and landing datasets."
requires-python = ">=3.13"
dependencies = [
  "albumentations>=2.0.8,<2.1",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "psutil>=6.0",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dataset-generator-m1 = "dataset_generator_m1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataset_generator_m1 = ["family_profiles/*.yaml", "profiles/builtin/*/*/*", "knowledge/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
