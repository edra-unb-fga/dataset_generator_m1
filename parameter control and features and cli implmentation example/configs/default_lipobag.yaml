# Default CLI arguments and global switches.
defaults:
  # Seed used for deterministic augmentation sequences.
  seed: 42
  # Number of worker processes; 0 keeps everything in the main process for easier debugging.
  workers: 0
  # Dataset split to process ("train", "val", "test", or "all" to include every split).
  split: all
  # Hard cap on the number of source images to augment; null means "use every file".
  limit: null

aio:
  # Persist the original (unaugmented) sample alongside generated variants.
  keep_original: true
  # Allow images with no remaining annotations after augmentation to be saved.
  allow_empty: false
  # Minimum IoU between augmented polygons and the original boxes; below this the sample is skipped.
  min_bbox_iou: 0.10
  # Write a manifest JSON summarising run statistics.
  manifest: true
  # When >0, export that many debug images with augmentation overlays to aid inspection.
  debug_preview: 5
  # Number of augmented copies to create per input image.
  augmentations_per_image: 6

# Augmentation recipe: grouped by the type of transformation applied.
augment:
  core:
    # Horizontal flip probability.
    flip_lr: 0.5
    # Vertical flip probability.
    flip_ud: 0.5
    # Random cropping range expressed as percentage of each edge removed.
    crop_percent: [0.0, 0.25]
    # Contrast multiplier range applied uniformly.
    contrast: [0.85, 1.25]
  geometric:
    # Probability of applying the geometric bundle.
    prob: 0.65
    affine:
      # Uniform scaling factor range.
      scale: [0.75, 1.5]
      # X/Y translation range as a fraction of image size.
      translate: [-0.15, 0.15]
      # Rotation range in degrees.
      rotate: [-15, 15]
      # Shear range in degrees.
      shear: [-1.5, 1.5]
    # Perspective warp strength; 0 disables, 0.02 is subtle.
    perspective_scale: [0.0, 0.05]
  texture_noise:
    # Independent control over blur-style augmenters.
    blurs:
      # Probability of sampling at least one blur.
      prob: 0.6
      # Number of blur augmenters to combine (int or [min, max]).
      someof: [1, 2]
      # Gaussian blur sigma range (0 disables).
      gaussian_sigma: [0.2, 1.6]
      # Motion blur kernel size in pixels.
      motion_kernel: [5, 25]
      # Motion blur angle range in degrees.
      motion_angle: [-60, 60]
    # Non-blur noise/brightness drops, sampled separately.
    perturb:
      # Probability of applying this perturbation bundle.
      prob: 0.8
      # How many perturbation augmenters to pick (int or [min, max]).
      someof: [1, 2]
      # Additive Gaussian noise scale (fraction of 255).
      additive_gaussian_noise: [0.0, 0.20]
      # Drop random pixels globally.
      dropout: [0.001, 0.02]
      # Extra per-channel dropout probability.
      dropout_per_channel: [0.02, 0.40]
      # Add or subtract brightness in the given range.
      brightness_add: [-10, 10]
      # Sparsely remove random patches (Cutout-style occlusion).
      cutout:
        prob: 0.00
        iterations: [0, 0]
        size: [0.04, 0.20]
        squared: false
        # Fill intensity for removed regions (single value or [min, max] for uniform sampling).
        cval: [0, 255]
        # How removed regions are filled ("constant" or "gaussian").
        fill_mode: "constant"
        # When true, sample cval independently per channel.
        per_channel: true
  color:
    # Probability of applying the colour bundle.
    prob: 0.6
    # Multiply channels uniformly by this factor range.
    multiply: [0.8, 1.5]
    # Additional per-channel multiplier probability.
    multiply_per_channel: [0.1, 0.4]
    # Hue shift range in degrees.
    hue_shift: [-8, 8]
    # Alpha for desaturation blend against grayscale (0=no change, 1=fully desaturated).
    desaturate_alpha: [0.0, 0.25]
  segmentation:
    # Augmentations inspired by segmentation workflows.
    uniform_voronoi:
      # Chance to apply Voronoi color averaging to the image.
      prob: 0.15
      # Number of Voronoi seed points (int or [min, max]).
      n_points: [5000, 20000]
      # Probability of replacing a cell by its mean colour (float or [min, max]).
      p_replace: [0.6, 1.0]
      # Optional maximum size for downscaling before Voronoi computation (null to disable).
      max_size: null
      # Interpolation mode used during down/up-scaling.
      interpolation: "linear"

paths:
  # Valid image file suffixes to ingest per split.
  image_suffixes: [".jpg", ".jpeg", ".png"]
  # Annotation file suffix (YOLO polygon format).
  label_suffix: ".txt"
