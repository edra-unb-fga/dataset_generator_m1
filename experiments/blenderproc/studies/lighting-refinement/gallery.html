<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matched lighting review</title><style>
:root{color-scheme:dark}body{margin:0;background:#111821;color:#edf3f7;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:1;background:#18232e;padding:1rem;box-shadow:0 2px 8px #0007}h1{font-size:1.25rem;margin:.1rem 0 .4rem}p{margin:.4rem 0;color:#c6d1d9}select,input,button{font:inherit;background:#273947;color:white;border:1px solid #7590a0;border-radius:5px;padding:.45rem}label{margin-right:1rem}main{padding:1rem;display:grid;gap:1.5rem}.triplet{border:1px solid #415666;border-radius:8px;padding:.8rem;background:#19242d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}.panel img{width:100%;cursor:zoom-in;background:#000}.panel h3{font-size:.96rem;margin:.3rem 0}.details{white-space:pre-wrap;overflow-wrap:anywhere;color:#bfd0dc;font-size:.8rem;max-height:10rem;overflow:auto}.missing{color:#ffb3a7}.state{font-weight:700}.incomplete{color:#ffb3a7}dialog{width:100vw;height:100vh;max-width:none;max-height:none;box-sizing:border-box;margin:0;background:#080d12;color:white;border:0;overflow:auto}dialog::backdrop{background:#000}dialog .grid img{width:100%;object-fit:contain;max-height:78vh}dialog button{position:sticky;top:0;z-index:2}a{color:#91cafa}@media(max-width:700px){.grid{grid-template-columns:1fr}header{position:static}}
</style></head><body><header><h1>Matched lighting review</h1><p id="state" class="state"></p><p id="treatments"></p><p>Display RGB metrics are descriptive, not calibrated lighting. Stress candidates are preselected originals; confirm glare visually. Click an image to inspect its triplet full screen.</p><label>Condition <select id="condition"><option value="">All</option></select></label><label><input id="stress" type="checkbox"> Stress candidates</label><label>Find job <input id="query" placeholder="Job ID or seed"></label><a href="metrics.json">Metrics and evidence</a></header><main id="cards"></main><dialog id="viewer"><button id="close">Close full screen</button><div id="viewContent"></div></dialog><script>
const data=__DATA__;
document.querySelector('#treatments').textContent=data.treatment_note;
const state=document.querySelector('#state');state.textContent=(data.complete?'Complete, strictly verified':'INCOMPLETE OR UNVERIFIED')+` · ${data.accepted_checksum_verified_images}/${data.expected_images} images · triplet verification ${data.strict_triplet_verification?'passed':'failed'} · stop ${data.stop_confirmed?'confirmed':'unconfirmed'}`;if(!data.complete)state.classList.add('incomplete');
const cards=document.querySelector('#cards'),viewer=document.querySelector('#viewer'),viewContent=document.querySelector('#viewContent');
for(const c of (data.conditions || ['outdoor-night','indoor'])){const option=document.createElement('option');option.value=c;option.textContent=c;document.querySelector('#condition').append(option)}
const groups=new Map();for(const image of data.images){const key=image.condition+'|'+image.job_id;if(!groups.has(key))groups.set(key,{condition:image.condition,id:image.job_id,index:image.index,seed:image.seed,items:{}});groups.get(key).items[image.variant]=image}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function panel(item,variant,fullscreen){const p=node('div',undefined,'panel');p.append(node('h3',variant));if(!item){p.append(node('p','Missing or invalid image','missing'));return p}const img=document.createElement('img');img.src=item.image;img.alt=item.condition+' '+item.job_id+' '+variant;img.loading='lazy';p.append(img);if(!fullscreen)img.onclick=()=>openGroup(item.condition,item.job_id);const m=item.metrics;const fmt=x=>x===null?'no visible target':Number(x).toFixed(3);p.append(node('p',`Visible mean ${fmt(m.visible_target_mean_rgb)} / 255 · all RGB ≥250 ${fmt(m.visible_target_fraction_rgb_all_ge250)} · any channel ≥250 ${fmt(m.visible_target_fraction_any_channel_ge250)} · all RGB ≤10 ${fmt(m.visible_target_fraction_rgb_all_le10)}`));const details=node('details');details.append(node('summary','Lighting and geometry metadata'));details.append(node('pre',JSON.stringify({seed:item.seed,reference_scene_index:item.reference_scene_index,lamps:item.lamps,geometry:item.environment_geometry_diagnostics,ground:item.ground_diagnostics,image_sha256:item.image_sha256},null,2),'details'));p.append(details);return p}
function groupCard(g,fullscreen=false){const section=node('section',undefined,'triplet');section.append(node('h2',`${g.condition} · ${g.id} · seed ${g.seed}${g.index<2?' · stress candidate':''}`));const grid=node('div',undefined,'grid');for(const v of (data.variants || ['baseline','soft','soft-fill']))grid.append(panel(g.items[v],v,fullscreen));section.append(grid);return section}
function openGroup(condition,id){viewContent.replaceChildren(groupCard(groups.get(condition+'|'+id),true));viewer.showModal()}
function render(){cards.replaceChildren();const condition=document.querySelector('#condition').value,stress=document.querySelector('#stress').checked,q=document.querySelector('#query').value.toLowerCase();for(const g of groups.values())if((!condition||g.condition===condition)&&(!stress||g.index<2)&&(!q||(g.id+' '+g.seed).toLowerCase().includes(q)))cards.append(groupCard(g));if(!cards.children.length)cards.append(node('p','No images match these filters.'))}
for(const id of ['condition','stress','query'])document.querySelector('#'+id).addEventListener('input',render);document.querySelector('#close').onclick=()=>viewer.close();render();
</script></body></html>
