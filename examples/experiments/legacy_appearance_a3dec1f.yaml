schema_version: 1
source_commit: a3dec1f
status: archival-translation
notes:
  - Original settings were recovered from both minimal profiles at the source commit.
  - Duplicated legacy YAML keys are represented once.
  - Albumentations 2.0.8 parameter names replace legacy wrapper names.
  - AtmosphericFog is unsupported and is approximated by RandomFog.
appearance:
  background:
