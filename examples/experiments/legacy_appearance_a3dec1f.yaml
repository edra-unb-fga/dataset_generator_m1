    - {id: legacy-bg-brightness, type: RandomBrightnessContrast, probability: 0.7, params: {brightness_limit: [-0.32, 0.32], contrast_limit: [-0.32, 0.32], brightness_by_max: true, ensure_safe_range: true}}
    - {id: legacy-bg-blur, type: GaussianBlur, probability: 0.15, params: {blur_limit: [3, 5], sigma_limit: [0.0, 0.6]}}
    - {id: legacy-bg-noise, type: GaussNoise, probability: 0.2, params: {std_range: [0.0, 0.06], mean_range: [0.0, 0.0], per_channel: false}}
  foreground:
