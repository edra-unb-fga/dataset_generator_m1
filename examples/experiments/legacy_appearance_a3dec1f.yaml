    - {id: legacy-fg-shadow, type: PlasmaShadow, probability: 0.4, params: {shadow_intensity_range: [0.1, 0.25], plasma_size: 1200, roughness: 2.0}}
    - {id: legacy-fg-light, type: PlasmaBrightnessContrast, probability: 0.7, params: {brightness_range: [-0.08, 0.08], contrast_range: [-0.08, 0.08], plasma_size: 256, roughness: 1.8}}
