    - {id: legacy-final-temperature, type: PlanckianJitter, probability: 0.6, params: {mode: blackbody, temperature_limit: [5000, 12000], sampling_method: gaussian}}
    - {id: legacy-final-salt-pepper, type: SaltAndPepper, probability: 0.3, params: {amount: [0.01, 0.05], salt_vs_pepper: [0.45, 0.55]}}
    - {id: legacy-final-motion, type: MotionBlur, probability: 0.35, params: {blur_limit: [13, 17], angle_range: [0, 180], direction_range: [-1, 1], allow_shifted: true}}
    - {id: legacy-final-shadow, type: PlasmaShadow, probability: 0.4, params: {shadow_intensity_range: [0.1, 0.3], plasma_size: 400, roughness: 2.3}}
    - {id: legacy-final-light, type: PlasmaBrightnessContrast, probability: 0.6, params: {brightness_range: [-0.3, 0.3], contrast_range: [-0.3, 0.3], plasma_size: 300, roughness: 2.2}}
    - {id: legacy-final-flare, type: RandomSunFlare, probability: 0.15, params: {flare_roi: [0.0, 0.0, 1.0, 1.0], src_radius: 400, src_color: [80, 80, 80], angle_range: [0.0, 0.1], num_flare_circles_range: [1, 6], method: physics_based}}
