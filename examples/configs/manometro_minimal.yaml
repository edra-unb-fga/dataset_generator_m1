# Minimal manometro smoke config.
# Full schema/defaults: docs/CONFIG_SCHEMA.md
# Verbose stage behavior: docs/ARCHITECTURE_VERBOSE.md

dataset_type: manometro # default: manometro
num_images: 10 # default: 10
output_dir: outputs/manometro-minimal # default: outputs/generated
debug: 5 # default: 0
debug_dir: debug # default: debug
seed: 42 # default: 42

paths:
  backgrounds_dir: backgrounds # default: backgrounds
  foregrounds_dir: foregrounds/manometro_foregrounds # default for manometro: foregrounds/manometro_foregrounds
  recursive_backgrounds: true # default: true

output:
  image_size: [1280, 1280] # default: [1280, 1280]
  image_format: jpg # default: jpg
  label_format: yolo # default: yolo
  write_data_yaml: true # default: true
  write_manifest: true # default: true

sampling:
  foreground_instances_range: [1, 2] # default: [1, 2]
  foreground_scale_range: [0.20, 0.45] # default: [0.20, 0.45]
  min_instance_distance_px: 20 # default: 20
  max_placement_attempts: 50 # default: 50
  final_crop_size_range: [1280, 1280] # default: [1280, 1280]

perspective_transformations:
  probability: 0.25 # default: 0.25
  scale_range: [0.0, 0.02] # default: [0.0, 0.02]
  shear_range: [-0.015, 0.015] # default: [-0.015, 0.015]

background_affine_transformations:
  rotation:
    angle_range: [-6, 6] # default: [-6, 6]
    probability: 0.35 # default: 0.35
  scaling:
    scale_range: [0.96, 1.06] # default: [0.96, 1.06]
    probability: 0.35 # default: 0.35
  translation:
    translate_range: [-0.04, 0.04] # default: [-0.04, 0.04]
    probability: 0.2 # default: 0.2

foreground_affine_transformations:
  rotation:
    mode: square # default for manometro: square
    angle_range: [-35, 35] # default for manometro: [-35, 35]
    probability: 0.8 # default for manometro: 0.8

background_filters:
  ColorFilters:
    HueSaturationValue: # docs: https://explore.albumentations.ai/transform/HueSaturationValue
      hue_shift_range: [-6, 6] # default: [-6, 6]
      sat_shift_range: [-18, 18] # default: [-18, 18]
      val_shift_range: [-12, 12] # default: [-12, 12]
      probability: 0.3 # default: 0.3
    RandomBrightnessContrast: # docs: https://explore.albumentations.ai/transform/RandomBrightnessContrast
      brightness_range: [-0.12, 0.12] # default: [-0.12, 0.12]
      contrast_range: [-0.12, 0.12] # default: [-0.12, 0.12]
      brightness_by_max: true # default: true
      ensure_safe_output: true # default: true
      probability: 0.4 # default: 0.4
  BlurAndNoiseFilters:
    GaussianBlur: # docs: https://explore.albumentations.ai/transform/GaussianBlur
      blur_limit: [3, 5] # default: [3, 5]
      sigma_limit: [0.0, 0.6] # default: [0.0, 0.6]
      probability: 0.15 # default: 0.15
    GaussNoise: # docs: https://explore.albumentations.ai/transform/GaussNoise
      std_range: [0.0, 0.06] # default: [0.0, 0.06]
      mean_range: [0.0, 0.0] # default: [0.0, 0.0]
      per_channel: false # default: false
      probability: 0.2 # default: 0.2

foreground_filters:
  ColorFilters:
    HueSaturationValue: # docs: https://explore.albumentations.ai/transform/HueSaturationValue
      hue_shift_range: [-3, 3] # default: [-3, 3]
      sat_shift_range: [-8, 8] # default: [-8, 8]
      val_shift_range: [-6, 6] # default: [-6, 6]
      probability: 0.2 # default: 0.2
  BlurAndNoiseFilters:
    AdditiveNoise: # docs: https://explore.albumentations.ai/transform/AdditiveNoise
      noise_type: gaussian # default: gaussian
      spatial_mode: shared # default: shared
      noise_params: null # default: null
      probability: 0.1 # default: 0.1
  AtmosphericEffectsFilters:
    PlasmaShadow: # docs: https://explore.albumentations.ai/transform/PlasmaShadow
      shadow_intensity_range: [0.1, 0.35] # default: [0.1, 0.35]
      plasma_size: 256 # default: 256
      roughness: 3.0 # default: 3.0
      probability: 0.0 # default: 0.0
    PlasmaBrightnessContrast: # docs: https://explore.albumentations.ai/transform/PlasmaBrightnessContrast
      brightness_range: [-0.08, 0.08] # default: [-0.08, 0.08]
      contrast_range: [-0.08, 0.08] # default: [-0.08, 0.08]
      plasma_size: 256 # default: 256
      roughness: 3.0 # default: 3.0
      probability: 0.0 # default: 0.0
    RandomSunFlare: # docs: https://explore.albumentations.ai/transform/RandomSunFlare
      flare_roi: [0.0, 0.0, 1.0, 0.5] # default: [0.0, 0.0, 1.0, 0.5]
      src_radius: 80 # default: 80
      src_color: [255, 255, 255] # default: [255, 255, 255]
      angle_range: [0.0, 1.0] # default: [0.0, 1.0]
      num_flare_circles_range: [1, 3] # default: [1, 3]
      method: overlay # default: overlay
      probability: 0.0 # default: 0.0

final_filters:
  ColorFilters:
    RandomGamma: # docs: https://explore.albumentations.ai/transform/RandomGamma
      gamma_range: [90, 110] # default: [90, 110]
      probability: 0.2 # default: 0.2
    PlanckianJitter: # docs: https://explore.albumentations.ai/transform/PlanckianJitter
      mode: blackbody # default: blackbody
      temperature_range: [5000, 8500] # default: [5000, 8500]
      sampling_method: uniform # default: uniform
      probability: 0.1 # default: 0.1
  BlurAndNoiseFilters:
    SaltAndPepper: # docs: https://explore.albumentations.ai/transform/SaltAndPepper
      amount_range: [0.0, 0.01] # default: [0.0, 0.01]
      salt_vs_pepper_range: [0.45, 0.55] # default: [0.45, 0.55]
      probability: 0.0 # default: 0.0
    MotionBlur: # docs: https://explore.albumentations.ai/transform/MotionBlur
      blur_range: [3, 5] # default: [3, 5]
      allow_shifted: true # default: true
      angle_range: [-12, 12] # default: [-12, 12]
      direction_range: [-0.2, 0.2] # default: [-0.2, 0.2]
      probability: 0.1 # default: 0.1
  AtmosphericEffectsFilters:
    PlasmaShadow: # docs: https://explore.albumentations.ai/transform/PlasmaShadow
      shadow_intensity_range: [0.1, 0.35] # default: [0.1, 0.35]
      plasma_size: 256 # default: 256
      roughness: 3.0 # default: 3.0
      probability: 0.0 # default: 0.0
    PlasmaBrightnessContrast: # docs: https://explore.albumentations.ai/transform/PlasmaBrightnessContrast
      brightness_range: [-0.08, 0.08] # default: [-0.08, 0.08]
      contrast_range: [-0.08, 0.08] # default: [-0.08, 0.08]
      plasma_size: 256 # default: 256
      roughness: 3.0 # default: 3.0
      probability: 0.0 # default: 0.0
    RandomSunFlare: # docs: https://explore.albumentations.ai/transform/RandomSunFlare
      flare_roi: [0.0, 0.0, 1.0, 0.5] # default: [0.0, 0.0, 1.0, 0.5]
      src_radius: 80 # default: 80
      src_color: [255, 255, 255] # default: [255, 255, 255]
      angle_range: [0.0, 1.0] # default: [0.0, 1.0]
      num_flare_circles_range: [1, 3] # default: [1, 3]
      method: overlay # default: overlay
      probability: 0.0 # default: 0.0
    Illumination: # docs: https://explore.albumentations.ai/transform/Illumination
      mode: linear # default: linear
      intensity_range: [0.01, 0.12] # default: [0.01, 0.12]
      effect_type: both # default: both
      angle_range: [0, 360] # default: [0, 360]
      center_range: [0.25, 0.75] # default: [0.25, 0.75]
      sigma_range: [0.2, 0.6] # default: [0.2, 0.6]
      probability: 0.0 # default: 0.0
    AtmosphericFog: # docs: https://explore.albumentations.ai/transform/AtmosphericFog
      density_range: [0.05, 0.15] # default: [0.05, 0.15]
      fog_color: [255, 255, 255] # default: [255, 255, 255]
      depth_mode: linear # default: linear
      probability: 0.0 # default: 0.0
